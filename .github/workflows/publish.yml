name: Publish

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: corepack enable
      - run: npm install --global version-patch
      - run: pnpm install --frozen-lockfile

      - name: Set the version
        run: >
          version-patch node "${{ github.event.release.tag_name }}"
          --prefix v
          --git-commit
          --git-msg "chore(release): v{VERSION}"
          --git-name "github-actions[bot]"
          --git-email "41898282+github-actions[bot]@users.noreply.github.com"

      - run: pnpm build
      - run: npm publish
      - run: git pull --rebase && git push
